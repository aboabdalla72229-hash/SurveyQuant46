name: SurveyQuant v1.0.46 APK Builder

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Find ZIP
        shell: bash
        run: |

          echo "Searching for SurveyQuant ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SurveyQuantAndroid_v1.0.46_ALL_REQUESTED_FIXES.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SurveyQuant ZIP was not found."
            echo ""
            echo "Files found in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |

          echo "Extracting project..."

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo ""
          echo "=== EXTRACTED PROJECT ==="

          find "$GITHUB_WORKSPACE/extracted_project" \
            -maxdepth 6 \
            -print | sort

      - name: Locate Android Project
        shell: bash
        run: |

          echo "Searching for Gradle project..."

          GRADLEW=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name "gradlew" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then

            echo "ERROR: gradlew was not found."

            echo ""
            echo "Searching for Gradle files..."

            find "$GITHUB_WORKSPACE/extracted_project" \
              -type f \
              \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              \) \
              | sort

            exit 1

          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project Structure
        shell: bash
        run: |

          echo "=== ANDROID PROJECT ==="

          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f | sort

      - name: Prepare Gradle
        shell: bash
        run: |

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |

          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.46-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk
          if-no-files-found: error
