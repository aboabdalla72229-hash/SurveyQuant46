name: SurveyQuant 46 APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SurveyQuantAndroid_v1.0.46_ALL_REQUESTED_FIXES.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP NOT FOUND"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle NOT FOUND"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "===================================="
          echo "ANDROID PROJECT"
          echo "===================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect Project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "===================================="
          echo "PROJECT FILES"
          echo "===================================="

          find . -maxdepth 3 -type f | sort

          echo ""
          echo "===================================="
          echo "SETTINGS.GRADLE"
          echo "===================================="

          cat settings.gradle || true

          echo ""
          echo "===================================="
          echo "ROOT BUILD.GRADLE"
          echo "===================================="

          cat build.gradle || true

          echo ""
          echo "===================================="
          echo "APP BUILD.GRADLE"
          echo "===================================="

          cat app/build.gradle || true

      - name: Install Gradle 8.7
        shell: bash
        run: |

          set -e

          echo "===================================="
          echo "INSTALLING GRADLE 8.7"
          echo "===================================="

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O /tmp/gradle.zip

          sudo mkdir -p /opt/gradle

          sudo unzip -q \
            /tmp/gradle.zip \
            -d /opt/gradle

          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          /opt/gradle/gradle-8.7/bin/gradle --version

      - name: Build SurveyQuant
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "===================================="
          echo "BUILDING SURVEYQUANT"
          echo "===================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |

          set -e

          echo "===================================="
          echo "SEARCHING FOR APK"
          echo "===================================="

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK NOT GENERATED"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/final_apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/final_apk/SurveyQuant-v1.0.46-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.46-APK
          path: final_apk/SurveyQuant-v1.0.46-debug.apk
          if-no-files-found: error
