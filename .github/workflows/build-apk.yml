name: SurveyQuant 46 APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find SurveyQuant ZIP
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "SEARCHING FOR SURVEYQUANT ZIP"
          echo "=========================================="

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SurveyQuantAndroid_v1.0.46_ALL_REQUESTED_FIXES.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP FILE NOT FOUND"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

      - name: Locate Android Project
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "LOCATING ANDROID PROJECT"
          echo "=========================================="

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name "settings.gradle" \
            -o \
            -name "settings.gradle.kts" \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project
        shell: bash
        run: |

          echo "=========================================="
          echo "PROJECT STRUCTURE"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -maxdepth 5 \
            -type f \
            | sort

      - name: Install Gradle
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "INSTALLING GRADLE"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y gradle

          gradle --version

      - name: Check Android Project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "=========================================="
          echo "ANDROID PROJECT CHECK"
          echo "=========================================="

          echo ""
          echo "settings.gradle:"
          cat settings.gradle || true

          echo ""
          echo "Root build.gradle:"
          cat build.gradle || true

          echo ""
          echo "App build.gradle:"
          cat app/build.gradle || true

      - name: Build SurveyQuant
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "=========================================="
          echo "BUILDING SURVEYQUANT"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: APK WAS NOT GENERATED."
            echo ""

            find "$PROJECT_DIR" \
              -maxdepth 7 \
              -type f \
              | sort

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/final_apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/final_apk/SurveyQuant-v1.0.46-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.46-APK
          path: final_apk/SurveyQuant-v1.0.46-debug.apk
          if-no-files-found: error
