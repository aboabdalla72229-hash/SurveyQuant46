name: SurveyQuant 46 APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Find ZIP File
      # ==========================================

      - name: Find SurveyQuant ZIP
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "SEARCHING FOR SURVEYQUANT ZIP"
          echo "=========================================="

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SurveyQuantAndroid_v1.0.46_ALL_REQUESTED_FIXES.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then

            echo ""
            echo "ERROR: SurveyQuant ZIP was not found."
            echo ""

            echo "Files currently inside repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"
          echo ""

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 4. Extract ZIP
      # ==========================================

      - name: Extract SurveyQuant Project
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "EXTRACTING SURVEYQUANT PROJECT"
          echo "=========================================="

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo ""
          echo "EXTRACTION COMPLETED."
          echo ""

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted_project" \
            -maxdepth 6 \
            -type f \
            -print \
            | sort


      # ==========================================
      # 5. Find Android Gradle Project
      # ==========================================

      - name: Locate Android Project
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "SEARCHING FOR ANDROID GRADLE PROJECT"
          echo "=========================================="

          GRADLEW=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then

            echo ""
            echo "ERROR: gradlew was not found."
            echo ""

            echo "Searching for Gradle files..."

            find "$GITHUB_WORKSPACE/extracted_project" \
              -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "gradle-wrapper.properties" \
              \) \
              -print \
              | sort

            echo ""
            echo "Possible Android project folders:"

            find "$GITHUB_WORKSPACE/extracted_project" \
              -type f \
              -name "AndroidManifest.xml" \
              -print \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Verify Gradle Project
      # ==========================================

      - name: Verify Android Project
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFYING ANDROID PROJECT"
          echo "=========================================="

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew does not exist."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo ""
          echo "Gradle wrapper:"
          ls -lh "$PROJECT_DIR/gradlew"

          echo ""
          echo "Project files:"

          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort


      # ==========================================
      # 7. Check Java
      # ==========================================

      - name: Check Java
        shell: bash
        run: |

          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version


      # ==========================================
      # 8. Check Gradle
      # ==========================================

      - name: Check Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          ./gradlew --version


      # ==========================================
      # 9. Clean Project
      # ==========================================

      - name: Clean Project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "=========================================="
          echo "CLEANING PROJECT"
          echo "=========================================="

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 10. Build APK
      # ==========================================

      - name: Build SurveyQuant APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "=========================================="
          echo "BUILDING SURVEYQUANT APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ==========================================
      # 11. Find Generated APK
      # ==========================================

      - name: Find Generated APK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "SEARCHING FOR GENERATED APK"
          echo "=========================================="

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo ""
          echo "APK COUNT: $APK_COUNT"
          echo ""

          if [ "$APK_COUNT" -eq 0 ]; then

            echo "ERROR: No APK was generated."

            echo ""
            echo "Build directory:"
            find "$PROJECT_DIR" \
              -maxdepth 6 \
              -type d \
              -name "outputs" \
              -print

            exit 1
          fi

          echo "GENERATED APK FILES:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 12. Copy APK to Easy Location
      # ==========================================

      - name: Prepare APK Artifact
        shell: bash
        run: |

          set -e

          mkdir -p "$GITHUB_WORKSPACE/final_apk"

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/final_apk/SurveyQuant-v1.0.46-debug.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh "$GITHUB_WORKSPACE/final_apk/SurveyQuant-v1.0.46-debug.apk"


      # ==========================================
      # 13. Upload APK
      # ==========================================

      - name: Upload SurveyQuant APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.46-APK
          path: final_apk/SurveyQuant-v1.0.46-debug.apk
          if-no-files-found: error
